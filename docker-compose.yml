services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: dontoverpay-backend:local
    environment:
      DONTOVERPAY_DATA: /data
    volumes:
      - dontoverpay-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: dontoverpay-frontend:local
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  dontoverpay-data:
